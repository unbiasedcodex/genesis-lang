name: CI

on:
  push:
  workflow_dispatch:

env:
  LLVM_SYS_180_PREFIX: /usr/lib/llvm-18

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev libpolly-18-dev clang-18 libzstd-dev zlib1g-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Build glc
        run: cargo build --release

      - name: Run tests
        run: cargo test --release

      - name: Compile the .gl test programs
        run: |
          # tests/codegen holds regression programs; cargo test does not build
          # them, so compile each one and fail on the first that breaks.
          status=0
          for f in tests/codegen/*.gl; do
            if ./target/release/glc build "$f" --freestanding --emit-obj -o /tmp/t.o > /tmp/t.log 2>&1; then
              echo "OK   $f"
            else
              echo "FAIL $f"
              cat /tmp/t.log
              status=1
            fi
          done
          exit $status
